name: Repository Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run docs:check
  executor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 构建非特权执行器
        run: docker build -f apps/executor/Dockerfile -t gravitas-executor-test .
      - name: 检测内层 Linux namespace 能力
        id: sandbox
        shell: bash
        run: |
          if docker run --rm --read-only --tmpfs /tmp:rw,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --security-opt seccomp=apps/executor/seccomp.json gravitas-executor-test bwrap --unshare-all --ro-bind / / -- /bin/true; then
            echo "available=1" >> "$GITHUB_OUTPUT"
          else
            echo "available=0" >> "$GITHUB_OUTPUT"
            echo "::warning::当前 GitHub 托管 runner 拒绝容器内创建 Linux namespace；已运行 Executor 静态契约测试。完整隔离与取消验收必须在支持该能力的 Linux runner 执行。"
          fi
      - name: Linux 隔离契约与实际验收
        run: GRAVITAS_EXECUTOR_SANDBOX_AVAILABLE=${{ steps.sandbox.outputs.available }} docker run --rm --read-only --tmpfs /tmp:rw,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --security-opt seccomp=apps/executor/seccomp.json --pids-limit 128 --memory 1g --cpus 1 -e GRAVITAS_EXECUTOR_SANDBOX_AVAILABLE gravitas-executor-test bun test src
